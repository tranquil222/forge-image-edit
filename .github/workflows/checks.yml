name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install numpy pillow
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/image_transfer.test.cjs tests/lightbox.test.cjs tests/curves.test.cjs tests/outpaint.test.cjs
      - run: python -m compileall -q forge_qwen_edit tools
  backend-patch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base:
          - '41359cd4b8b89212b3dbad8c9af719160a12ed63'
          - 'dc0145513e4fe9274e71bc3fd3ea2cb97a5bd8c9'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check and apply against the supported public base
        shell: bash
        run: |
          git init "$RUNNER_TEMP/forge"
          git -C "$RUNNER_TEMP/forge" remote add origin https://github.com/Haoming02/sd-webui-forge-classic
          git -C "$RUNNER_TEMP/forge" fetch --depth=1 origin ${{ matrix.base }}
          git -C "$RUNNER_TEMP/forge" checkout --detach FETCH_HEAD
          python tools/backend_support.py --forge-root "$RUNNER_TEMP/forge"
          python tools/backend_support.py --forge-root "$RUNNER_TEMP/forge" --apply
          python tools/backend_support.py --forge-root "$RUNNER_TEMP/forge"
